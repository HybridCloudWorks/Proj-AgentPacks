{
  "canonical": {
    "manifest": "apm.yml",
    "agents": ".apm/agents/*.agent.md",
    "skills": ".apm/skills/<name>/SKILL.md, with scripts and templates in the same folder",
    "instructions": ".apm/instructions/*.instructions.md",
    "prompts": ".apm/prompts/*.prompt.md",
    "generation": "Vendor files are generated by apm install (behavior recorded for APM 0.33.0 on 2026-10-18) or by the Code Workflow installer; none are committed."
  },
  "targets": {
    "copilot": {
      "agents": ".github/agents/<name>.agent.md, frontmatter copied verbatim; specialists carry user-invocable false and include-custom-instructions true",
      "skills": ".agents/skills",
      "instructions": ".github/instructions/*.instructions.md",
      "prompts": ".github/prompts/*.prompt.md",
      "user_scope": "apm install -g deploys instructions and prompts only; agents reach ~/.copilot/agents through the Code Workflow installer",
      "limits": "Unknown tool names are ignored silently; the canonical agents carry no tools field."
    },
    "claude": {
      "agents": ".claude/agents/<name>.md, frontmatter copied verbatim",
      "skills": ".claude/skills",
      "instructions": ".claude/rules/<name>.md (applyTo becomes path scoping)",
      "prompts": ".claude/commands/<name>.md (the agent key is dropped)",
      "user_scope": "Full with apm install -g",
      "limits": "Agents inherit all tools until an installer applies the declared intents."
    },
    "codex": {
      "agents": ".codex/agents/<name>.toml with name, description and body only",
      "skills": ".agents/skills",
      "instructions": "folded into AGENTS.md by apm compile",
      "prompts": "not deployed",
      "user_scope": "agents, skills, hooks, mcp",
      "limits": "Sandbox and approvals are inherited from the parent session; role text is not isolation."
    },
    "kiro": {
      "agents": ".kiro/agents/<name>.md with description, model and tools only",
      "skills": ".kiro/skills",
      "instructions": ".kiro/steering/<name>.md",
      "prompts": "not deployed",
      "user_scope": "~/.kiro equivalents",
      "limits": "A tools value outside Kiro's capability tags makes APM refuse the agent; none is set."
    },
    "gemini": {
      "agents": "not deployed; Gemini CLI has no agents primitive in APM",
      "skills": ".agents/skills",
      "instructions": "folded into GEMINI.md by apm compile",
      "prompts": ".gemini/commands/<name>.toml",
      "user_scope": "~/.gemini equivalents",
      "limits": "Specialists are unavailable; the workflows are reachable through skills and commands."
    },
    "agent-skills": {
      "skills": ".agents/skills",
      "limits": "Skills only; each skill states its own approval rule and works without the contract instruction."
    }
  },
  "hooks": "Not deployed by APM. hooks/ holds helper scripts and a reviewed Copilot sample; the Code Workflow installer wires hooks to its own pack home.",
  "mcp": "No MCP servers are declared. Cloudflare's remote MCP servers are used only when the user has connected them.",
  "fallback": "The primary uses the same skills directly when delegation or a connector is unavailable.",
  "validated": "Shared tooling/validate_pack.py: structure, frontmatter, content references, apm compile --validate, apm install into a scratch project for all six targets, and the pack's offline unit tests. Live client discovery and live Cloudflare behavior are not established."
}
