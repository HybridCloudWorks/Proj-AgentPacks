# Declared tool permissions per agent (source of truth for vendor-specific generation).
# APM copies the agents' frontmatter verbatim and does not translate tool names, so the
# canonical agents omit `tools` and inherit the host's tools. Installers that generate
# vendor files themselves map these intents: read, edit, shell, web, delegate, todo, mcp.
version: 1
agents:
  microsoft-certified-trainer:
    intent: [delegate, edit, mcp, read, shell, todo, web]
  microsoft-copilot-learning-reviewer:
    intent: [edit, mcp, read, todo, web]
  microsoft-course-architect:
    intent: [edit, read, todo, web]
  microsoft-courseware-engineer:
    intent: [edit, read, shell, todo, web]
  microsoft-lab-demo-engineer:
    intent: [edit, mcp, read, shell, todo, web]
