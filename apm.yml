# The whole catalog as one install: `apm install hybridcloudworks/Proj-AgentPacks` (or `-g` for the user profile)
# pulls every released pack at its release tag. Each pack is also installable on its own:
# `apm install hybridcloudworks/Proj-AgentPacks/<pack>#<pack-name>-vX.Y.Z`. This file is generated by
# tooling/root_manifest.py from the packs' apm.yml versions; do not edit the list by hand.
name: agent-packs
version: 1.0.0
description: Every agent pack in this catalog, pinned to its release tag.
author: hybridcloudworks
license: MIT
repository: https://github.com/hybridcloudworks/Proj-AgentPacks
targets:
  - copilot
  - claude
  - codex
  - kiro
  - gemini
  - agent-skills
dependencies:
  apm:
    - hybridcloudworks/Proj-AgentPacks/ansible-expert-engineer-pack#ansible-expert-engineer-v1.2.0
    - hybridcloudworks/Proj-AgentPacks/apple-code-reviewer-pack#apple-code-reviewer-v1.2.0
    - hybridcloudworks/Proj-AgentPacks/aws-cloud-architect-pack#aws-cloud-architect-v1.4.0
    - hybridcloudworks/Proj-AgentPacks/aws-expert-designer-pack#aws-expert-designer-v1.4.0
    - hybridcloudworks/Proj-AgentPacks/azure-cloud-architect-pack#azure-cloud-architect-v1.4.0
    - hybridcloudworks/Proj-AgentPacks/azure-expert-designer-pack#azure-expert-designer-v1.4.0
    - hybridcloudworks/Proj-AgentPacks/cloud-documentation-archivist-pack#cloud-documentation-archivist-v1.2.0
    - hybridcloudworks/Proj-AgentPacks/cloud-prepress-reviewer-pack#cloud-prepress-reviewer-v1.2.0
    - hybridcloudworks/Proj-AgentPacks/cloudflare-subject-matter-expert-pack#cloudflare-subject-matter-expert-v1.0.0
    - hybridcloudworks/Proj-AgentPacks/docker-senior-engineer-pack#docker-senior-engineer-v1.0.0
    - hybridcloudworks/Proj-AgentPacks/finops-professional-practitioner-pack#finops-professional-practitioner-v1.0.0
    - hybridcloudworks/Proj-AgentPacks/github-expert-engineer-pack#github-expert-engineer-v1.2.0
    - hybridcloudworks/Proj-AgentPacks/google-cloud-architect-pack#google-cloud-architect-v1.2.0
