pack: terraform-expert-engineer
required_sections:
  - objective
  - scope_and_authorization
  - changed_files
  - commands_and_results
  - plan_or_state_impact
  - evidence_classification
  - risks_and_limitations
  - next_safe_action
rules:
  - redact state, plan, credentials, sensitive variables, and backend secrets
  - distinguish static, local, live-cloud, inferred, and unavailable evidence
  - do not claim apply, lock, policy, HCP, AVM certification, or provider acceptance proof without direct evidence
  - ask before apply, destroy, state mutation, force-unlock, HCP permission changes, policy weakening, or production work
