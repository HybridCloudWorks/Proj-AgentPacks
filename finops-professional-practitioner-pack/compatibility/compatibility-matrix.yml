{
  "canonical": {
    "manifest": "apm.yml",
    "agents": ".apm/agents/*.agent.md",
    "skills": ".apm/skills/<name>/SKILL.md plus reference files in the same folder",
    "instructions": ".apm/instructions/*.instructions.md",
    "prompts": ".apm/prompts/*.prompt.md",
    "generation": "Vendor files are generated by apm install or by the Code Workflow installer; none are committed. The shared validator installs this pack into a scratch project for all six declared targets."
  },
  "targets": {
    "copilot": {
      "agents": ".github/agents/<name>.agent.md, frontmatter copied verbatim",
      "skills": ".agents/skills",
      "instructions": ".github/instructions/*.instructions.md",
      "prompts": ".github/prompts/*.prompt.md",
      "user_scope": "apm install -g deploys instructions and prompts only; agents reach ~/.copilot/agents through the Code Workflow installer",
      "limits": "Specialists set include-custom-instructions: true so they receive the contract instruction as subagents. The skills key on specialists is a Claude Code field and is not relied on by Copilot."
    },
    "claude": {
      "agents": ".claude/agents/<name>.md, frontmatter copied verbatim",
      "skills": ".claude/skills",
      "instructions": ".claude/rules/<name>.md",
      "prompts": ".claude/commands/<name>.md (the agent key is dropped)",
      "user_scope": "Full with apm install -g",
      "limits": "Agents inherit all host tools because no tools field is declared. Specialists preload focus-billing-data-analysis through the skills field."
    },
    "codex": {
      "agents": ".codex/agents/<name>.toml with name, description and body only",
      "skills": ".agents/skills",
      "instructions": "folded into AGENTS.md by APM",
      "prompts": "not deployed",
      "user_scope": "agents, skills, hooks and MCP; not instructions or prompts",
      "limits": "Sandbox and approvals are inherited from the parent session; role text is not isolation. A user-scope install needs the installer to place the contract in ~/.codex/AGENTS.md."
    },
    "kiro": {
      "agents": ".kiro/agents/<name>.md with description, model and tools only",
      "skills": ".kiro/skills",
      "instructions": ".kiro/steering/<name>.md",
      "prompts": "not deployed",
      "user_scope": "~/.kiro equivalents",
      "limits": "Whether custom agents inherit steering by default is undocumented; verify on the target build."
    },
    "gemini": {
      "agents": "not deployed; APM has no Gemini agents primitive",
      "skills": ".agents/skills",
      "instructions": "folded into GEMINI.md by APM",
      "prompts": ".gemini/commands/<name>.toml",
      "user_scope": "~/.gemini equivalents",
      "limits": "Specialists are unavailable; the workflows run through skills and commands, and the primary's fallback (same skills, review not independent) applies."
    },
    "agent-skills": {
      "skills": ".agents/skills",
      "limits": "Skills only; each skill carries its own minimum approval rule for use without the contract."
    }
  },
  "hooks": "Not deployed by APM. hooks/ holds helper scripts and a reviewed Copilot sample; the Code Workflow installer wires hooks to its own pack home.",
  "fallback": "The primary uses the same skills directly when delegation is unavailable and states that the review was not independent.",
  "validated": "tooling/validate_pack.py at the repository root: structure, frontmatter, content references, unit tests, apm compile --validate and apm install into a scratch project for all six targets. Live client discovery is not established."
}
