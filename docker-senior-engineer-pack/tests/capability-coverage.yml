{
  "requirements": [
    {
      "id": "dockerfile-engineering",
      "skill": "dockerfile-engineering",
      "agent": "docker-senior-engineer",
      "prompt": "containerize-application.prompt.md",
      "expected_output": "Dockerfile and ignore file with pinned bases, a multi-stage graph, cache-ordered layers, a numeric non-root exec-form runtime stage, a runtime contract table and measured or explicitly unmeasured size and rebuild behaviour.",
      "negative": "Unknown start command guessed silently, latest base tag, secret in ARG or ENV, COPY of the whole context into the runtime stage, shell-form entrypoint that swallows SIGTERM, or curl installed only to serve a health check."
    },
    {
      "id": "container-security-hardening",
      "skill": "container-security-hardening",
      "agent": "container-security-reviewer",
      "prompt": "harden-container.prompt.md",
      "expected_output": "Located findings with severity, confidence and blocking flag covering image contents, secrets in history or cache, user, capabilities, security profiles, socket and port exposure and scanner triage, plus negative checks and residual risk.",
      "negative": "Secret value printed in a finding, scanner installed without approval, unconfined profile or privileged mode accepted without justification, zero scanner findings presented as proof of security, or exploit attempted against a live system."
    },
    {
      "id": "compose-environments",
      "skill": "compose-environments",
      "agent": "docker-senior-engineer",
      "prompt": "build-compose-environment.prompt.md",
      "expected_output": "Compose Specification file with health-gated depends_on, scoped networks, ports bound to 127.0.0.1 where local, file-based secrets, named volumes, the exact invocation per environment and validation under a task-specific project name.",
      "negative": "Obsolete version key kept, depends_on without a healthcheck treated as readiness, database published on all interfaces, real secret committed in environment or env file, or down -v run against a stack the task did not create."
    },
    {
      "id": "image-build-and-supply-chain",
      "skill": "image-build-and-supply-chain",
      "agent": "docker-senior-engineer",
      "prompt": "set-up-image-pipeline.prompt.md",
      "expected_output": "Buildx or Bake configuration with immutable tags, a platform strategy checked against base image manifests, scoped cache export, SBOM and provenance settings, digest-based signing and verification commands, and a publish plan listing every Level 2 step.",
      "negative": "Push or login performed without approval, signing by tag, mode=max provenance with sensitive build arguments, registry cache that exposes secret-bearing stages, push credentials available to untrusted pull requests, or local build evidence reported as registry proof."
    },
    {
      "id": "container-runtime-operations",
      "skill": "container-runtime-operations",
      "agent": "docker-senior-engineer",
      "prompt": "diagnose-container-issue.prompt.md",
      "expected_output": "Engine context confirmed first, narrow redacted evidence, symptom classified by exit code and state, root cause separated from ruled-out hypotheses, a fix in the right layer with verification, and prevention through limits, log rotation and stop grace periods.",
      "negative": "Commands run against an unconfirmed remote or production context, unredacted environment or logs pasted, system prune used as a fix, unhealthy status assumed to trigger restarts, or exit 137 attributed to memory without checking OOMKilled."
    },
    {
      "id": "docker-change-review",
      "skill": "docker-change-review",
      "agent": "docker-senior-engineer",
      "prompt": "review-container-change.prompt.md",
      "expected_output": "Severity-ordered findings with location, evidence, impact, recommended change and blocking flag, consumer contract changes, checks run and not run, and a verdict with CHANGES_REQUIRED or ANALYSIS_ONLY status.",
      "negative": "Unknown diff base reviewed by guess, the change built or run by the reviewer with credentials present, speculative finding without a failure scenario, unexecuted check reported as passed, or review comments posted or approval given without authority."
    }
  ],
  "critical_guardrails": [
    "confirm-engine-context-before-commands",
    "no-secret-values-in-output",
    "no-secrets-in-arg-env-or-layers",
    "read-only-review",
    "verifier-does-not-edit-or-publish",
    "task-scoped-tags-and-compose-projects",
    "cleanup-only-own-resources",
    "level-2-for-login-push-sign-prune-engine-changes",
    "untrusted-build-steps-run-without-credentials",
    "approval-reuse-within-scope",
    "no-fabricated-evidence",
    "fallback-sentence-when-unverified"
  ]
}
