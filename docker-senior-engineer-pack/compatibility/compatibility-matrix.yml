{
  "canonical": {
    "manifest": "apm.yml",
    "agents": ".apm/agents/*.agent.md",
    "skills": ".apm/skills/<name>/SKILL.md, with supporting files in the same folder",
    "instructions": ".apm/instructions/*.instructions.md",
    "prompts": ".apm/prompts/*.prompt.md",
    "generation": "Vendor files are generated by apm install or by the Code Workflow installer; none are committed. APM facts were verified with APM 0.33.0 on 2026-10-18 per the repository's client-locations record."
  },
  "targets": {
    "copilot": {
      "agents": ".github/agents/<name>.agent.md, frontmatter copied verbatim, including user-invocable and include-custom-instructions",
      "skills": ".agents/skills",
      "instructions": ".github/instructions/*.instructions.md",
      "prompts": ".github/prompts/*.prompt.md",
      "user_scope": "apm install -g deploys instructions and prompts only; agents go to ~/.copilot/agents through the Code Workflow installer",
      "limits": "Unknown tool names are ignored silently; the canonical agents carry no tools field. Subagents read repository instructions only because include-custom-instructions is set."
    },
    "claude": {
      "agents": ".claude/agents/<name>.md, frontmatter copied verbatim",
      "skills": ".claude/skills",
      "instructions": ".claude/rules/<name>.md (applyTo becomes paths)",
      "prompts": ".claude/commands/<name>.md (the agent key is dropped)",
      "user_scope": "Full with apm install -g",
      "limits": "Agents inherit all tools; Copilot-only keys are ignored."
    },
    "codex": {
      "agents": ".codex/agents/<name>.toml with name, description and body only",
      "skills": ".agents/skills",
      "instructions": "folded into AGENTS.md by apm compile",
      "prompts": "not deployed",
      "user_scope": "agents, skills, hooks, mcp",
      "limits": "Sandbox and approvals are inherited from the parent session; the verifier's no-edit rule and the reviewer's read-only rule are text, not isolation."
    },
    "kiro": {
      "agents": ".kiro/agents/<name>.md with description, model and tools only",
      "skills": ".kiro/skills",
      "instructions": ".kiro/steering/<name>.md",
      "prompts": "not deployed",
      "user_scope": "~/.kiro equivalents",
      "limits": "A tools value outside Kiro's capability tags makes APM refuse the agent; none is set."
    },
    "gemini": {
      "agents": "not deployed; Gemini CLI has no agents primitive in APM",
      "skills": ".agents/skills",
      "instructions": "folded into GEMINI.md by apm compile",
      "prompts": ".gemini/commands/<name>.toml",
      "user_scope": "~/.gemini equivalents",
      "limits": "Specialists are unavailable; the workflow is reachable through skills, instructions and commands."
    },
    "agent-skills": {
      "skills": ".agents/skills",
      "limits": "Skills only; each skill is self-contained."
    }
  },
  "hooks": "Not deployed by APM. hooks/ holds helper scripts and a reviewed Copilot sample; the Code Workflow installer wires hooks to its own pack home.",
  "fallback": "The primary uses the same skills directly when delegation is unavailable and states that the review or verification was not independent.",
  "validated": "tooling/validate_pack.py at the repository root: structure, frontmatter, content references, unit tests, apm compile --validate, and apm install into a scratch project for all six targets. Live client discovery and user-scope installs are not established."
}
