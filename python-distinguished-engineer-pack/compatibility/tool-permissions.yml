# Declared tool permissions per agent (source of truth for vendor-specific generation).
# APM copies the agents' frontmatter verbatim and does not translate tool names, so the
# canonical agents omit `tools` and inherit the host's tools. Installers that generate
# vendor files themselves map these intents: read, edit, shell, web, delegate, todo.
version: 1
agents:
  agent-evaluation-engineer:
    intent: [edit, read, shell]
  python-distinguished-engineer:
    intent: [delegate, edit, read, shell]
  python-performance-engineer:
    intent: [read, shell]
  python-security-reviewer:
    intent: [read]
  python-test-engineer:
    intent: [edit, read, shell]
