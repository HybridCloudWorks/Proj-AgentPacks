pack: cloud-prepress-reviewer
recommendations: [READY_FOR_PR, READY_FOR_DEPLOYMENT_REVIEW, CHANGES_REQUIRED, BLOCKED_ON_HUMAN_DECISION, NOT_VERIFIED]
required_sections:
  - scope_and_inputs
  - changed_paths_and_methods
  - evidence_ledger
  - findings
  - skipped_checks_and_limits
  - architecture_and_adr_status
  - security_iac_policy_and_identity_status
  - tests_build_and_preview_status
  - operations_rollback_cost_and_inputs
  - unresolved_risks_and_human_blockers
  - recommendation
  - engineer_handoff
finding_fields: [id, severity, status, file, line, scenario, impact, recommendation, verification]
severity: [Critical, High, Medium, Low]
evidence_labels: [observed, inferred, designed, structurally-validated, preview-verified, live-read-verified, accepted-risk, not-verified]
