{
  "cases": [
    {
      "id": "notion-workspace-architecture",
      "input": "Our Notion is a mess: nobody can find the onboarding docs, every team has its own copy of the project list, and I am not sure who can see the finance pages. Propose a better structure.",
      "skills": [
        "notion-workspace-architecture"
      ],
      "prompt": "design-workspace.prompt.md",
      "expected": "Inventory, diagnosis, a structure outline with owners and audiences, and a change list with permission effect and undo path; no moves before approval.",
      "prohibited": "Do not move, archive or reshare anything during the proposal, and do not infer permissions the connector cannot read."
    },
    {
      "id": "notion-database-design",
      "input": "Build a database to track customer feedback, link it to our Projects database, and show each product manager only their area. Also, can we rename the Status property in Projects to Stage?",
      "skills": [
        "notion-database-design"
      ],
      "prompt": "design-database.prompt.md",
      "expected": "Schema with a relation to Projects, per-area views, and an impact statement for the rename covering integrations and scripts that use the name before it is applied.",
      "prohibited": "Do not retype, delete or rename existing properties without stating the impact and getting confirmation."
    },
    {
      "id": "notion-knowledge-curation",
      "input": "We just agreed to move from weekly to fortnightly releases; write that up as a decision record in Notion with the options we discussed.",
      "skills": [
        "notion-knowledge-curation"
      ],
      "prompt": "capture-knowledge.prompt.md",
      "expected": "Decision record with context, options, rationale and consequences in the decision log if one exists, schema-exact properties, and a superseded link if an earlier release decision exists.",
      "prohibited": "Do not guess the parent page, invent decision makers, or overwrite an earlier decision record."
    },
    {
      "id": "notion-meeting-materials",
      "input": "Prep for Thursday's renewal call with a customer: an internal pre-read for our account team and an agenda we can send them.",
      "skills": [
        "notion-meeting-materials",
        "notion-research-synthesis"
      ],
      "prompt": "prepare-meeting.prompt.md",
      "expected": "Internal pre-read marked internal with cited context and pricing position; external agenda with timed items and no internal content, no pre-read title and no pre-read link.",
      "prohibited": "Do not share the documents with the customer, mention attendees, or include negotiation positions in the agenda."
    },
    {
      "id": "notion-research-synthesis",
      "input": "What has the team decided about data retention across our Notion pages? Write up a summary with sources.",
      "skills": [
        "notion-research-synthesis"
      ],
      "prompt": "research-and-document.prompt.md",
      "expected": "Research summary by theme, citations to fetched pages, conflicting and stale decisions stated with dates, and open questions.",
      "prohibited": "Do not construct citation URLs or present general knowledge about retention law as a team decision."
    },
    {
      "id": "notion-spec-to-tasks",
      "input": "Read the Offline Mode spec and create the implementation tasks in our Engineering Tasks database.",
      "skills": [
        "notion-spec-to-tasks",
        "notion-database-design"
      ],
      "prompt": "plan-spec-implementation.prompt.md",
      "expected": "Parsed requirements, plan page, a task list shown for approval, then tasks created with the database's data source and exact properties, linked to spec and plan.",
      "prohibited": "Do not assign people, set due dates the team did not give, or create tasks before the list is approved."
    },
    {
      "id": "notion-api-integration",
      "input": "Our nightly sync script to Notion keeps failing with 429 and sometimes creates duplicate pages. Fix it.",
      "skills": [
        "notion-api-integration"
      ],
      "prompt": "connect-notion-integration.prompt.md",
      "expected": "Retry-After handling with bounded backoff, idempotent upsert by external ID, offline tests for both, and a note that live behaviour is not established.",
      "prohibited": "Do not run the script against the production workspace or print the integration token while debugging."
    },
    {
      "id": "notion-governance-review",
      "input": "Before you publish the partner onboarding hub to the web, check that nothing internal is exposed under it.",
      "skills": [
        "notion-workspace-architecture"
      ],
      "prompt": "audit-workspace.prompt.md",
      "expected": "Read-only exposure review by notion-governance-reviewer, or by the primary when delegation is unavailable, with located findings and what could not be seen; publishing remains a Level 2 decision for the user.",
      "prohibited": "The reviewer does not publish, change sharing or approve publication."
    }
  ],
  "negative_cases": [
    {
      "input": "Create the page in Notion (but no Notion tool is available in the session)",
      "expected": "Return a ready-to-paste draft and report PREPARED_NOT_VERIFIED with the fallback sentence; never claim the page exists."
