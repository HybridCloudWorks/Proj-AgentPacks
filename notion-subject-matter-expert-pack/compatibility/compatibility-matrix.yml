{
  "canonical": {
    "manifest": "apm.yml",
    "agents": ".apm/agents/*.agent.md",
    "skills": ".apm/skills/<name>/SKILL.md, with each skill's reference file in the same folder",
    "instructions": ".apm/instructions/*.instructions.md",
    "prompts": ".apm/prompts/*.prompt.md",
    "generation": "Vendor files are generated by apm install or by the Code Workflow installer; none are committed."
  },
  "targets": {
    "copilot": {
      "agents": ".github/agents/<name>.agent.md, frontmatter copied verbatim (user-invocable and include-custom-instructions are honoured here)",
      "skills": ".agents/skills",
      "instructions": ".github/instructions/*.instructions.md",
      "prompts": ".github/prompts/*.prompt.md",
      "user_scope": "apm install -g deploys instructions and prompts only; agents go to ~/.copilot/agents through the Code Workflow installer",
      "limits": "Unknown tool names are ignored silently; the canonical agents carry no tools field. Notion tools come from an MCP server the user configures."
    },
    "claude": {
      "agents": ".claude/agents/<name>.md, frontmatter copied verbatim",
      "skills": ".claude/skills",
      "instructions": ".claude/rules/<name>.md (applyTo becomes paths)",
      "prompts": ".claude/commands/<name>.md (the agent key is dropped)",
      "user_scope": "Full with apm install -g",
      "limits": "Agents inherit all tools, including Notion write tools, so the reviewer's read-only boundary is behavioural unless the installer applies tool-permissions.yml."
    },
    "codex": {
      "agents": ".codex/agents/<name>.toml with name, description and body only",
      "skills": ".agents/skills",
      "instructions": "folded into AGENTS.md by apm compile",
      "prompts": "not deployed",
      "user_scope": "agents, skills, hooks, mcp",
      "limits": "Sandbox and approvals are inherited from the parent session; role text is not isolation."
    },
    "kiro": {
      "agents": ".kiro/agents/<name>.md with description, model and tools only",
      "skills": ".kiro/skills",
      "instructions": ".kiro/steering/<name>.md",
      "prompts": "not deployed",
      "user_scope": "~/.kiro equivalents",
      "limits": "A tools value outside Kiro's capability tags makes APM refuse the agent, which is why the canonical agents declare none."
    },
    "gemini": {
      "agents": "not deployed; APM generates no agents for Gemini CLI",
      "skills": ".agents/skills",
      "instructions": "folded into GEMINI.md by apm compile",
      "prompts": ".gemini/commands/<name>.toml",
      "user_scope": "~/.gemini equivalents",
      "limits": "The governance reviewer is unavailable; the primary's workflows are reachable through skills and commands, and reviews are not independent."
    },
    "agent-skills": {
      "skills": ".agents/skills",
      "limits": "Skills only; each skill states its own guardrails for standalone use."
    }
  },
  "notion_connector": "No Notion MCP server, integration or token is configured by the pack. Users connect one in their host; tool names depend on the server and the host's prefix.",
  "hooks": "Not deployed by APM. hooks/ holds manual helpers and a reviewed Claude Code sample; the Code Workflow installer or the user wires hooks to the pack's real location.",
  "fallback": "The primary uses the same skills directly when delegation is unavailable, and returns drafts when no Notion connector is available.",
  "validated": "The shared tooling/validate_pack.py checks structure, frontmatter, content references, cross-file consistency, the pack's unit tests, apm compile --validate, and apm install into a scratch project for all six targets when apm is available. Live client discovery and live Notion behaviour are not established."
}
