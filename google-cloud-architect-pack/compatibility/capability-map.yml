{
  "name": "google-cloud-architect",
  "version": "1.1.0",
  "primary": "google-cloud-architect",
  "agents": [
    {
      "name": "google-cloud-architect",
      "description": "Google Cloud architect for requirements-driven solution design, landing zones, decision records, Well-Architected reviews, migration and DR planning, and plan-only infrastructure validation.",
      "tools": ["read", "search", "edit", "execute", "web", "agent"],
      "user_invocable": true,
      "claude_tools": ["Read", "Grep", "Glob", "Edit", "Write", "Bash", "WebFetch", "WebSearch", "Agent"],
      "gemini_tools": ["read_file", "grep_search", "glob", "write_file", "replace", "run_shell_command"],
      "kiro_tools": ["read", "write", "shell", "web", "subagent"],
      "note": "`tools` expresses the intent with Copilot's aliases; the claude_tools, gemini_tools and kiro_tools lists are the same intent in each client's own tool names, for installers that write client files. The agent file itself has no tools field. APM gives Gemini CLI no agents."
    },
    {
      "name": "gcp-estate-inspector",
      "description": "Read-only discovery of a named Google Cloud organization, folder or project with gcloud, bq and kubectl; returns a compact, cited inventory and evidence without changing anything.",
      "tools": ["read", "search", "execute"],
      "user_invocable": false,
      "claude_tools": ["Read", "Grep", "Glob", "Bash"],
      "gemini_tools": ["read_file", "grep_search", "run_shell_command"],
      "kiro_tools": ["read", "shell"],
      "note": "A shell can mutate; the read-only boundary is the impersonated viewer identity and host approvals, not the prompt."
    },
    {
      "name": "gcp-security-reviewer",
      "description": "Independent read-only review of Google Cloud designs and infrastructure changes for IAM, network exposure, data protection, perimeter and supply-chain risk; returns located findings.",
      "tools": ["read", "search"],
      "user_invocable": false,
      "claude_tools": ["Read", "Grep", "Glob"],
      "gemini_tools": ["read_file", "grep_search"],
      "kiro_tools": ["read"],
      "note": "No shell, edit or web: the review stays independent of live systems and cannot change anything."
    }
  ],
  "skills": [
    {"name": "gcp-solution-architecture", "trigger": "A complete multi-product Google Cloud architecture is needed for a workload.", "output": "Solution guide with traceability, diagram, decisions and validation plan.", "prompt": "design-solution"},
    {"name": "gcp-architecture-decisions", "trigger": "Google Cloud options must be compared or a hard-to-reverse decision recorded.", "output": "Comparison, recommendation and Proposed decision record.", "prompt": "record-decision"},
    {"name": "gcp-landing-zone", "trigger": "An organization foundation is set up, extended or reviewed.", "output": "Hierarchy, policy baseline, billing, logging and admin-group design.", "prompt": "design-landing-zone"},
    {"name": "gcp-identity-access", "trigger": "People, pipelines, workloads or agents need authentication and authorization design.", "output": "Identity architecture, role matrix and workload identity patterns.", "prompt": "design-landing-zone"},
    {"name": "gcp-network-design", "trigger": "VPCs, IP plans, connectivity, load balancing, egress or a path problem are in scope.", "output": "Topology, checked IP plan, connectivity, edge and firewall design.", "prompt": "design-network"},
    {"name": "gcp-security-controls", "trigger": "Data protection, perimeters, detection, compliance or supply chain are in scope.", "output": "Threat model, control matrix and located findings.", "prompt": "review-architecture"},
    {"name": "gcp-reliability-dr", "trigger": "Availability targets, redundancy, backups or DR against RTO and RPO are in scope.", "output": "SLOs, composite availability, DR pattern and test plan.", "prompt": "plan-resilience"},
    {"name": "gcp-cost-sustainability", "trigger": "Cost estimates, spend reviews, savings or carbon goals are in scope.", "output": "Cost model, attribution design, ranked savings and carbon actions.", "prompt": "optimize-cost"},
    {"name": "gcp-observability-operations", "trigger": "Monitoring, alerting, logging, readiness or release processes are in scope.", "output": "Telemetry design, alert catalog, queries and readiness checklist.", "prompt": "plan-resilience"},
    {"name": "gcp-gke-platform", "trigger": "GKE clusters are designed, audited, upgraded or onboarded.", "output": "Cluster design, golden-path comparison and platform standards.", "prompt": "design-solution"},
    {"name": "gcp-serverless-apps", "trigger": "Apps, APIs, events or jobs run on Cloud Run or related serverless services.", "output": "Tier, identity, connectivity and scaling design with runtime checks.", "prompt": "design-solution"},
    {"name": "gcp-data-analytics", "trigger": "Warehouses, lakehouses, pipelines, governance or lineage are in scope.", "output": "Data platform design, governance model and impact procedure.", "prompt": "design-solution"},
    {"name": "gcp-ai-agent-architecture", "trigger": "AI agents, RAG or model serving are designed or productionized.", "output": "Agent architecture, tool approvals, safety controls and evaluation plan.", "prompt": "design-solution"},
    {"name": "gcp-migration-planning", "trigger": "Workloads move to or within Google Cloud.", "output": "Assessment, waves, transfer and cutover plan with rollback.", "prompt": "plan-migration"},
    {"name": "gcp-iac-validation", "trigger": "Google Cloud Terraform is written, reviewed or planned.", "output": "Located findings and a risk-ranked plan summary.", "prompt": "validate-iac"},
    {"name": "gcp-well-architected-review", "trigger": "A design, estate or change is assessed against the six pillars.", "output": "Evidence-based findings, pillar summaries and roadmap.", "prompt": "review-architecture"},
    {"name": "gcp-estate-discovery", "trigger": "Facts are needed from a live Google Cloud environment.", "output": "Cited inventory, permission gaps and proposed Level 2 commands.", "prompt": "review-architecture"},
    {"name": "drawio-core-generation", "trigger": "An editable Draw.io diagram is created or substantially edited, for Google Cloud alone or with other providers.", "output": "Uncompressed .drawio file with current provider icons and correct boundary nesting.", "prompt": "create-architecture-diagram"},
    {"name": "drawio-render-export-and-review", "trigger": "A diagram is exported or its render is reviewed.", "output": "Exports at explicit paths and render findings.", "prompt": "create-architecture-diagram"},
    {"name": "diagram-validation-and-evidence", "trigger": "A diagram is reviewed, audited or claimed to be correct.", "output": "Validation report with structural, icon, semantic and visual results and evidence labels.", "prompt": "create-architecture-diagram"}
  ],
  "instructions": [
    "google-cloud-architect-contract.instructions.md",
    "gcp-terraform.instructions.md",
    "gcp-cli-scripts.instructions.md"
  ],
  "prompts": [
    "design-solution.prompt.md",
    "record-decision.prompt.md",
    "design-landing-zone.prompt.md",
    "design-network.prompt.md",
    "review-architecture.prompt.md",
    "validate-iac.prompt.md",
    "plan-migration.prompt.md",
    "plan-resilience.prompt.md",
    "optimize-cost.prompt.md",
    "create-architecture-diagram.prompt.md"
  ],
  "skill_scripts": [
    "gcp-estate-discovery/scripts/command_guard.py",
    "gcp-network-design/scripts/ip_plan.py",
    "gcp-reliability-dr/scripts/availability.py",
    "gcp-iac-validation/scripts/plan_summary.py",
    "diagram-validation-and-evidence/scripts/check_drawio.py"
  ],
  "source_dirs": [".apm", "compatibility", "docs", "examples", "hooks", "templates", "tests", "tooling"]
}
