name: watch diagram sources

# Weekly: rebuild the shared diagram skills' icon catalog from the newest draw.io release, and confirm each
# provider's current icon release on its official page (shared-primitives/diagram-facts.json). When either changed,
# open (or comment on) one issue with what changed and how to adopt it.
# build_icon_catalog.py exits 1 only for a real change and 2 when it could not fetch or parse draw.io's source: a
# failed fetch fails the run and never opens or comments on the issue.
# A push that edits the facts, the catalog or these scripts runs the same checks and simply fails if one is wrong.
on:
  schedule:
    - cron: '53 7 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - shared-primitives/diagram-facts.json
      - shared-primitives/skills/diagram-validation-and-evidence/scripts/icon_catalog.json
      - shared-primitives/skills/diagram-validation-and-evidence/scripts/icon_preferences.json
      - tooling/build_icon_catalog.py
      - tooling/check_vendor_facts.py
      - .github/workflows/watch-diagram-sources.yml

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TITLE: 'Diagram sources changed: re-verify the shared diagram skills'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: catalog
        name: draw.io icon libraries against the committed catalog
        # Records the exit status instead of failing the step: 0 unchanged, 1 changed (catalog.md says how), and 2,
        # or any other status, means the check could not run. The steps below act on it.
        run: |
          set +e
          python tooling/build_icon_catalog.py --check --tag latest --markdown catalog.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - id: facts
        name: provider icon releases on their official pages
        run: python tooling/check_vendor_facts.py --facts shared-primitives/diagram-facts.json --markdown facts.md
        continue-on-error: true
      - name: open or update the issue
        if: (steps.catalog.outputs.exit == '1' || steps.facts.outcome == 'failure') && github.event_name != 'push'
        env:
          CATALOG_EXIT: ${{ steps.catalog.outputs.exit }}
        run: |
          rm -f body.md
          if [ "$CATALOG_EXIT" = "1" ] && [ -f catalog.md ]; then cat catalog.md >> body.md; echo >> body.md; fi
          if [ -f facts.md ]; then cat facts.md >> body.md; fi
          [ -s body.md ] || echo "A check failed without writing details; see the workflow run log." > body.md
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
      - name: fail the run when the catalog check could not read draw.io's source
        if: steps.catalog.outputs.exit != '0' && steps.catalog.outputs.exit != '1'
        env:
          CATALOG_EXIT: ${{ steps.catalog.outputs.exit }}
        run: |
          echo "::error::build_icon_catalog.py exited ${CATALOG_EXIT:-without a status}: draw.io's source could not be fetched or parsed (see the catalog step's log). This is a failed run, not an icon change, so no issue was opened for it."
          exit 1
      - name: fail the run when something changed
        if: steps.catalog.outputs.exit == '1' || steps.facts.outcome == 'failure'
        run: exit 1
