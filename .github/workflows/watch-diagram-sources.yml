name: watch diagram sources

# Weekly: rebuild the shared diagram skills' icon catalog from the newest draw.io release, and confirm each
# provider's current icon release on its official page (shared-primitives/diagram-facts.json). When either changed,
# open (or comment on) one issue with what changed and how to adopt it.
# A push that edits the facts, the catalog or these scripts runs the same checks and simply fails if one is wrong.
on:
  schedule:
    - cron: '53 7 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - shared-primitives/diagram-facts.json
      - shared-primitives/skills/diagram-validation-and-evidence/scripts/icon_catalog.json
      - tooling/build_icon_catalog.py
      - tooling/check_vendor_facts.py
      - .github/workflows/watch-diagram-sources.yml

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TITLE: 'Diagram sources changed: re-verify the shared diagram skills'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: catalog
        name: draw.io icon libraries against the committed catalog
        run: python tooling/build_icon_catalog.py --check --tag latest --markdown catalog.md
        continue-on-error: true
      - id: facts
        name: provider icon releases on their official pages
        run: python tooling/check_vendor_facts.py --facts shared-primitives/diagram-facts.json --markdown facts.md
        continue-on-error: true
      - name: open or update the issue
        if: (steps.catalog.outcome == 'failure' || steps.facts.outcome == 'failure') && github.event_name != 'push'
        run: |
          { [ -f catalog.md ] && cat catalog.md && echo; [ -f facts.md ] && cat facts.md; } > body.md || true
          [ -s body.md ] || echo "A check failed without writing details; see the workflow run log." > body.md
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
      - name: fail the run when something changed
        if: steps.catalog.outcome == 'failure' || steps.facts.outcome == 'failure'
        run: exit 1
