name: publish

# Mirrors main and every pack release tag to the APM install location, hybridcloudworks/AgentPacks.
# This repository is where packs are written and reviewed; that one is where they are installed from.
# Needs the AGENTPACKS_PUBLISH_TOKEN secret: a fine-grained token with Contents: write on
# hybridcloudworks/AgentPacks only.
on:
  push:
    branches: [main]
    tags: ['*-v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: push main and release tags to the install location
        env:
          TOKEN: ${{ secrets.AGENTPACKS_PUBLISH_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "::error::AGENTPACKS_PUBLISH_TOKEN is not set (a fine-grained token with Contents: write on hybridcloudworks/AgentPacks)."; exit 1; }
          git remote add dist "https://x-access-token:${TOKEN}@github.com/hybridcloudworks/AgentPacks.git"
          git push dist refs/remotes/origin/main:refs/heads/main
          git push dist --tags
