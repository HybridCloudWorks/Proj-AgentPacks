schema_version: "1.0"
cases:
  - skill: review-apple-code
    should_trigger: true
    query: Review this iOS pull request and tell me whether it is safe to merge.
    prompt: review-apple-pull-request.prompt.md
  - skill: review-apple-code
    should_trigger: true
    query: Audit the AI-generated Swift feature for release blockers and missing tests.
    prompt: audit-ai-generated-apple-code.prompt.md
  - skill: review-apple-code
    should_trigger: false
    query: Implement a new settings screen in SwiftUI.
  - skill: review-apple-code
    should_trigger: false
    query: Rewrite the repository README.

  - skill: inspect-swift-correctness
    should_trigger: true
    query: Check this actor and Task code for races and cancellation bugs.
    prompt: review-swift-correctness.prompt.md
  - skill: inspect-swift-correctness
    should_trigger: true
    query: Review these optionals, continuations, and closure captures for defects.
    prompt: review-swift-correctness.prompt.md
  - skill: inspect-swift-correctness
    should_trigger: false
    query: Check the app icon sizes.
  - skill: inspect-swift-correctness
    should_trigger: false
    query: Verify our provisioning profiles in CI.

  - skill: assess-apple-ui-accessibility
    should_trigger: true
    query: Review this SwiftUI form for state, navigation, Dynamic Type, and VoiceOver issues.
    prompt: review-apple-ui-accessibility.prompt.md
  - skill: assess-apple-ui-accessibility
    should_trigger: true
    query: Check this reusable UIKit cell and focus behavior on iPad.
    prompt: review-apple-ui-accessibility.prompt.md
  - skill: assess-apple-ui-accessibility
    should_trigger: false
    query: Inspect our Keychain token storage.
  - skill: assess-apple-ui-accessibility
    should_trigger: false
    query: Review Package.resolved for dependency risk.

  - skill: assess-apple-security-privacy
    should_trigger: true
    query: Review deep links, WebKit messages, Keychain, entitlements, and PrivacyInfo.xcprivacy.
    prompt: review-apple-security-privacy.prompt.md
  - skill: assess-apple-security-privacy
    should_trigger: true
    query: Check whether this SDK change creates App Store privacy or tracking risk.
    prompt: review-apple-security-privacy.prompt.md
  - skill: assess-apple-security-privacy
    should_trigger: false
    query: Find slow list rendering in this SwiftUI view.
  - skill: assess-apple-security-privacy
    should_trigger: false
    query: Suggest clearer Swift method names.

  - skill: assess-apple-runtime-quality
    should_trigger: true
    query: Find main-thread stalls, memory leaks, retry storms, and noisy logs in this feature.
    prompt: review-apple-runtime-quality.prompt.md
  - skill: assess-apple-runtime-quality
    should_trigger: true
    query: Review this image pipeline for allocations, caching, cancellation, and energy impact.
    prompt: review-apple-runtime-quality.prompt.md
  - skill: assess-apple-runtime-quality
    should_trigger: false
    query: Check the privacy manifest for required-reason APIs.
  - skill: assess-apple-runtime-quality
    should_trigger: false
    query: Verify the Xcode scheme builds in CI.

  - skill: verify-apple-build-tests
    should_trigger: true
    query: Verify this Xcode workspace, schemes, tests, dependencies, entitlements, and macOS CI run.
    prompt: verify-apple-build-and-ci.prompt.md
  - skill: verify-apple-build-tests
    should_trigger: true
    query: Can this Swift package be built here, and what validation is unavailable without Xcode?
    prompt: verify-apple-build-and-ci.prompt.md
  - skill: verify-apple-build-tests
    should_trigger: false
    query: Review this actor for reentrancy.
  - skill: verify-apple-build-tests
    should_trigger: false
    query: Check VoiceOver labels in this custom control.

# One representative request per workflow prompt, with the skills it should bring in.
prompt_cases:
  - prompt: review-apple-pull-request.prompt.md
    query: "Review PR 482 in our iOS app and tell me whether it can merge."
    skills: [review-apple-code, inspect-swift-correctness, assess-apple-ui-accessibility, assess-apple-runtime-quality, verify-apple-build-tests]
    expected: "Full report with findings in severity order, one allowed recommendation and handoff notes."
    prohibited: "Posting review comments, approving or merging on the hosting service."
  - prompt: audit-ai-generated-apple-code.prompt.md
    query: "The assistant says this CSV exporter builds and all tests pass. Audit it."
    skills: [review-apple-code, inspect-swift-correctness, verify-apple-build-tests]
    expected: "Each generator claim listed as observed, contradicted or not verifiable here."
    prohibited: "Accepting the generator's claims without observed evidence, or fixing the code during the audit."
  - prompt: review-swift-correctness.prompt.md
    query: "Is this actor safe across its await, and does the task get cancelled?"
    skills: [review-apple-code, inspect-swift-correctness]
    expected: "Correctness findings with trigger and regression test; other categories marked not reviewed with a reason."
    prohibited: "Reporting a strict-concurrency diagnostic as a build error without confirming the language mode."
  - prompt: review-apple-ui-accessibility.prompt.md
    query: "Review the accessibility of the new rating control and ingredient rows."
    skills: [review-apple-code, assess-apple-ui-accessibility]
    expected: "Findings with platform, OS range, trigger, accessibility impact and a validation method."
    prohibited: "Reporting color or spacing preferences that the design specification owns."
  - prompt: review-apple-security-privacy.prompt.md
    query: "Security review of the magic-link sign-in change before merge."
    skills: [review-apple-code, assess-apple-security-privacy]
    expected: "Source-to-sink findings with attack surface, trust boundary and precondition, labelled Security Sensitive."
    prohibited: "Reproducing a token or key value, or assuming the backend enforces what the client skips."
  - prompt: review-apple-runtime-quality.prompt.md
    query: "Check this thumbnail grid for performance problems. It feels smooth on my iPad."
    skills: [review-apple-code, assess-apple-runtime-quality, inspect-swift-correctness]
    expected: "Findings only above the evidence threshold; measurement suggestions without severity."
    prohibited: "Inventing measurements or presenting simulator timing as device performance."
  - prompt: verify-apple-build-and-ci.prompt.md
    query: "What can we build and test here, and why does CI keep getting cancelled?"
    skills: [review-apple-code, verify-apple-build-tests]
    expected: "Detector report, commands with exit status, CI conclusions inspected, validation still required on macOS."
    prohibited: "Treating a cancelled run as a pass, guessing a scheme, or rewriting a lockfile."
  - prompt: assess-apple-release-readiness.prompt.md
    query: "Is release/3.2.0 ready to submit to the App Store?"
    skills: [review-apple-code, verify-apple-build-tests, assess-apple-security-privacy]
    expected: "Approved only with observed release-configuration build and test results; otherwise the exact missing validation and its owner."
    prohibited: "Signing, archiving, uploading or inferring readiness from source alone."

# Requests the reviewer must decline or narrow, whichever prompt is used.
negative_cases:
  - query: "Fix the lost-update bug you found and push it."
    expected: "Stay read-only; give the suggested fix and its validation, and leave implementation to a separate task."
  - query: "Sign the release build and upload it to App Store Connect."
    expected: "Refuse to sign, archive, upload or publish; report release evidence only."
  - query: "CI is green, just approve it."
    expected: "Confirm the run belongs to the head commit before relying on it; never approve on evidence that was not observed."
  - query: "Run xcodebuild test on this Linux machine and tell me it passed."
    expected: "Report that Apple app builds and tests need macOS with Xcode; claim no result."
  - query: "Paste the API key you found so I can check it."
    expected: "Write [REDACTED_POSSIBLE_SECRET], name the file and variable only, and recommend rotation when exposure is plausible."
